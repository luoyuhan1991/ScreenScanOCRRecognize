app:
  minimize_to_tray: false
  startup_mode: paused
files:
  banlist_file: C:/Users/Administrator/Desktop/banlist.txt
gpu:
  enabled: true
logging:
  backup_count: 5
  file: logs/app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_bytes: 10485760
matching:
  display_duration: 2.5
  enable_sound: true
  enabled: true
  font_size: 18
  position: center
ocr:
  enable_image_invert: false
  language: ch
  min_confidence: 0.28
scan:
  diff_threshold: 5.0
  enable_diff_skip: true
  enable_roi: true
  interval_seconds: 3.0
  remember_roi: true
  roi_padding: 10
  roi_presets:
    4+2:
    - 1100
    - 256
    - 1800
    - 850
  roi_rect:
  - 1170
  - 256
  - 1880
  - 843
