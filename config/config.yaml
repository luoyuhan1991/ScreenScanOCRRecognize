app:
  minimize_to_tray: true
  startup_mode: paused
cleanup:
  enabled: true
  interval_minutes: 10
  max_age_hours: 1
  scan_interval: 10
files:
  banlist_file: C:/Users/Administrator/Desktop/banlist.txt
  folder_mode: minute
  max_folders: 10
  output_dir: output
  save_ocr_result: false
  save_screenshot: false
gpu:
  auto_detect: false
  enabled: true
  force_cpu: false
  force_gpu: true
logging:
  backup_count: 5
  file: logs/app.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_bytes: 10485760
matching:
  display_duration: 2.0
  enable_sound: true
  enabled: true
  font_size: 18
  position: center
ocr:
  auto_detect_invert: false
  default_engine: paddle
  easyocr:
    canvas_size: 1920
    dynamic_params: true
    mag_ratio: 1.5
  enable_image_invert: false
  language: ch
  languages:
  - ch
  - en
  min_confidence: 0.3
  save_processed_image: false
performance:
  explicit_image_cleanup: true
  log_queue_cleanup_threshold: 800
  max_log_queue_size: 1000
  memory_monitor_interval_ms: 5000
  use_psutil: true
scan:
  diff_threshold: 4.8
  enable_diff_skip: true
  enable_roi: true
  interval_seconds: 1.8
  remember_roi: true
  roi_padding: 10
  roi_presets:
    4+2:
    - 1170
    - 256
    - 1880
    - 843
  roi_rect:
  - 1170
  - 256
  - 1880
  - 843
