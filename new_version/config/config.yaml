scan:
  interval_seconds: 2.0
  roi: null                     # [x1, y1, x2, y2] 或 null 表示全屏
  roi_padding: 10
  roi_presets: {}               # 命名预设 {"game_lobby": [1170, 256, 1880, 843]}
  diff_threshold: 5.0           # 帧差均方差阈值，低于此值跳过OCR

ocr:
  language: ch
  min_confidence: 0.3
  enable_image_invert: false

gpu:
  enabled: true

matching:
  banlist_file: docs/banlist.txt
  display_duration: 3.0
  position: center              # center/top/bottom
  font_size: 18
  enable_sound: true

logging:
  level: INFO
